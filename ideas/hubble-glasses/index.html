.jk-topbar{flex-wrap:wrap;gap:8px}.jk-topbar a{min-height:44px;display:inline-flex;align-items:center}body{overflow-wrap:anywhere}.jk-cover .exact-logo{width:min(100%,380px);height:auto;display:block;margin:0 auto 18px}.jk-cover .hero-symbol{width:120px;display:block;margin:0 auto 10px}.new-note{padding:12px 16px;background:#fff0e5;border-right:4px solid #f97316;border-radius:12px;margin:14px 0}.new-links{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.new-links a{min-height:44px;display:inline-flex;align-items:center;padding:6px 14px;border:1px solid #d9dde4;border-radius:12px;color:#101828;background:#fff;text-decoration:none}.quiz{border:2px solid #101828;border-radius:18px;padding:18px;margin:16px 0;background:#fffdf7}.quiz h2{font-family:MkCairo;margin:0 0 8px;font-size:20px}.quiz button{display:block;width:100%;padding:12px;margin:8px 0;border:1px solid #aeb5c0;border-radius:10px;background:#fff;text-align:start;font-size:16px;min-height:44px}.quiz .chosen{border-color:#f97316;background:#fff0e5}.quiz-result{font-weight:700;min-height:2em}.jk-ln{text-align:start}a{overflow-wrap:anywhere}.source-url{display:block;direction:ltr;unicode-bidi:isolate;word-break:break-word;font-family:Arial;font-size:13px;margin-top:6px}.jk-en{white-space:pre-wrap;overflow-wrap:anywhere}.jk-ix{display:none}@media(max-width:480px){.jk-row{display:block!important}.jk-row>*{width:100%!important}.jk-topbar{padding:10px!important}.jk-topbar a{font-size:13px!important}.jk-cover{padding:22px 16px}.jk-icons{grid-template-columns:repeat(3,minmax(0,1fr))}.jk{padding-inline:10px}.jk-tabs{gap:5px}.jk-tab{font-size:13px}.jk-en{font-size:14px}}</style></head><body><div class="jk-topbar"><a class="jk-tb-back" href="../../index.html">→ مكتبة سطرين</a><a class="jk-tb-pdf" href="hubble-glasses.pdf" download="التلسكوب اللي احتاج نظارة.pdf">تحميل PDF</a><a class="jk-tb-pdf" href="prompt.txt" download>البرومبت</a><a class="jk-tb-pdf" href="narration-ar.txt" download>نص التسجيل</a></div><main class="jk" id="app"></main><script>window.JKDATA={"slug": "hubble-glasses", "n": "جديد", "title": "التلسكوب اللي احتاج نظارة", "hook": "هابل: إزاي اتصلحت الصورة من غير تغيير المرآة الرئيسية؟", "duration_ar": "حوالي 5 دقائق، حسب التسجيل", "scenes": [{"name": "فوق الهوا... والصورة مش صافية", "a": "0:00", "z": "0:40", "icon": "⚙", "rule": "التوقيت تقديري. لا تُقرأ إرشادات الصورة. وقفة طبيعية قبل الكشف وعند نهاية المشهد.", "lines": ["تخيل ترفع تلسكوبا للفضاء عشان يشوف من غير تشويش الغلاف الجوي، وبعدها تكتشف إن الصورة مش بالوضوح اللي كنت مستنيه.", "مش سحابة عدت قدامه، ولا حد نسي يمسح عدسة من بره.", "فيه خطأ دقيق في شكل المرآة الرئيسية نفسها.", "ده اللي واجه تلسكوب هابل بعد إطلاقه سنة ألف تسعمية وتسعين.", "السؤال المحرج بقى: هنرجعه؟", "هنغير المرآة؟", "ولا فيه طريقة نصحح اللي بيحصل للضوء من غير ما نبدل أكبر جزء في الحكاية؟", "الحل اللي جه بعد كده اتشبه بنظارة، لكن النظارة هنا كانت شغلا هندسيا بيتنفذ فوق الأرض."], "screen": "**فوق الهوا... والصورة مش صافية**", "visual": "نجم يتحول إلى بقعة حول مركز، ثم التلسكوب. عبارة: تشبيه بصري مبسط.", "why": "النص هو أساس المشهد؛ الرسم يشرح الفكرة ولا يضيف واقعة غير موثقة."}, {"name": "فرق صغير... أثر واضح", "a": "0:40", "z": "1:22", "icon": "⚙", "rule": "التوقيت تقديري. لا تُقرأ إرشادات الصورة. وقفة طبيعية قبل الكشف وعند نهاية المشهد.", "lines": ["المرايا في التلسكوب وظيفتها تجمع الضوء وتوجهه بالطريقة المطلوبة.", "ولو الشكل مش مضبوط، الضوء ما يتجمعش كما ينبغي.", "ناسا بتوصف مشكلة هابل بانحراف كروي: أطراف المرآة كانت متشكلة بطريقة مختلفة عن المطلوب، بفارق دقيق جدا، لكنه كفاية يأثر في الصورة.", "ودي حاجة غريبة لحد بيقيس بأحجام حياته اليومية؛ فرق صغير جدا في قطعة كبيرة ممكن يبقى فارقا ضخما في وظيفة حساسة.", "مش لأن الصغير سحر، لكن لأن الجهاز كله مبني على علاقة دقيقة بين الشكل والضوء.", "كلمة صغير لوحدها ما تقولكش إن الخطأ غير مهم؛ لازم تسأل: صغير بالنسبة لإيه؟"], "screen": "**فرق صغير... أثر واضح**", "visual": "مساران للضوء لا يلتقيان في بؤرة واحدة. لا مقياس مبالغ فيه من غير ليبل.", "why": "النص هو أساس المشهد؛ الرسم يشرح الفكرة ولا يضيف واقعة غ async function copyText(t,btn){
  try{await navigator.clipboard.writeText(t);btn.classList.add('jk-copied');const o=btn.textContent;btn.textContent='اتنسخ';setTimeout(()=>{btn.classList.remove('jk-copied');btn.textContent=o;},1600);}

function build(){

    const b=ce('button','jk-tab'+(i===0?' on':''));b.innerHTML=IC_SVG(ICON[ic])+' '+l;

function buildScenes(v){
  const how=ce('div','jk-how');
  how.innerHTML=`إزاي تستخدم الصفحة؟ دوس على أيقونة مشهد يظهر، ودوس على أي سطر تلوّنه <span class="jk-k o">برتقالي</span> للمهم أو <span class="jk-k g">أخضر</span> للي راجعته.`;
  v.appendChild(how);
  // icon grid

  D.scenes.forEach((s,i)=>{
    const b=ce('button','jk-ic');
    b.innerHTML=`<span class="jk-in">${i+1}</span><span class="jk-ico">${iconFor(s.icon||'')}</span><span class="jk-it">${s.name}</span>`;
    b.onclick=()=>{const card=$('#sc'+i);card.style.display='';card.scrollIntoView({behavior:'smooth',block:'start'});};

  });
  const all=ce('button','jk-ic');all.innerHTML=`<span class="jk-ico">${IC_SVG(ICON.eye)}</span><span class="jk-it">كل المشاهد</span>`;

  showAll.onclick=()=>{v.querySelectorAll('.jk-scene').forEach(c=>c.style.display='');showAll.classList.add('on');hideAll.classList.remove('on');};
  hideAll.onclick=()=>{v.querySelectorAll('.jk-scene').forEach(c=>c.style.display='none');hideAll.classList.add('on');showAll.classList.remove('on');};
  const cp=ce('button','jk-tb acc','انسخ السيناريو كله');
  cp.onclick=()=>copyText(scenarioText(),cp);
  tools.appendChild(showAll);tools.appendChild(hideAll);tools.appendChild(cp);
  v.appendChild(tools);

  D.scenes.forEach((s,i)=>{
    const card=ce('div','jk-scene');card.id='sc'+i;
    const sh=ce('div','jk-sh');

    const h2=ce('h2',null,s.name);sh.appendChild(h2);

    const row=ce('div','jk-row');
    const scr=ce('div','jk-scr');scr.appendChild(ce('div','jk-lab','نص الشاشة'));scr.appendChild(markKw(s.screen));
    const vis=ce('div','jk-vis');vis.appendChild(ce('div','jk-lab','المرئيات'));const vp=ce('p');vp.textContent=s.visual;wrapEn(vp);vis.appendChild(vp);
    wrapEn(scr);row.appendChild(scr);row.appendChild(vis);card.appendChild(row);
    if(s.why){const ex=ce('div','jk-exp');ex.appendChild(ce('div','jk-lab','ليه المشهد ده؟'));ex.appendChild(ce('p',null,s.why));card.appendChild(ex);}

function buildPrompt(v){

function buildFacts(v){

function scenarioText(){
  let out=`سطرين | Satreen — سيناريو جديد\n${D.title}\n${D.hook}\n\n`;
  D.scenes.forEach((s,i)=>{
    out+=`المشهد ${i+1}: ${s.name} (${s.a} – ${s.z})\n`;
    if(s.rule)out+=s.rule+'\n';
    out+='التعليق الصوتي:\n'+s.lines.join('\n')+'\n';
    out+='نص الشاشة: '+s.screen.replace(/\*\*/g,'')+'\n';
    out+='المرئيات: '+s.visual+'\n';
    if(s.why)out+='ليه؟ '+s.why+'\n';
    out+='\n';
  });
  return out;
}
