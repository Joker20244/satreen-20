<script>window.JKDATA={"slug": "popsicle", "n": "١١", "accent": "#38bdf8", "variant": 2, "title": "عصير نسي في التلج", "hook": "حكاية المصاصة وفرانك إيبرسون: طفل عنده 11 سنة نسي كوبايته في البرد، فصحى لقاها أشهر تسالي الصيف", "en_desc": "the story of Frank Epperson and the accidental invention of the Popsicle", "en_desc_tr": "حكاية فرانك إيبرسون واختراع المصاصة بالصدفة وهو طفل", "en_topic": "THE FROZEN PORCH VISUAL LANGUAGE", "topic_ar": "الشرفة المتجمدة", "hook_req_en": "open with a hook that grabs attention instantly. Do NOT name Popsicle or show any ice pop in the first 15 seconds. Dive straight into the mystery: a kid forgets a cup with a wooden stick on a cold porch, and finds it frozen solid in the morning.", "hook_req_tr": "ابدأ بخطاف يشد فورًا. متقولش «مصاصة» ومتعرضش آيس كريم في أول 15 ثانية. ادخل في اللغز على طول: طفل نسي كوباية فيها عود خشب على شرفة ساقعة، وصحى لقاها متجمدة.", "visual_lang_en": ["The frozen cup: a 1905 San Francisco porch drawn at dawn, frost on the railing, a cup with a wooden stick frozen solid, warm morning light hitting the ice.", "The pull: a kid's hand pulling the frozen drink out of the cup by the stick, drawn step by step, the shape sliding out whole.", "The stand: a small neighborhood stand drawn years later with kids lined up, the same frozen treat on sticks, labeled \"Epsicle\" before the name changes."], "visual_lang_tr": ["الكوباية المتجمدة: شرفة في سان فرانسيسكو سنة 1905 مرسومة وقت الفجر، صقيع على السور، وكوباية فيها عود خشب متجمدة تمامًا، وضوء الصبح بيضرب التلج.", "السحبة: إيد طفل بتسحب المشروب المتجمد من الكوباية من العود، مرسومة خطوة بخطوة، والشكل بينزل سليم.", "الكشك: كشك صغير في الحارة بعد سنين، أطفال واقفين في طابور، ونفس الحلوى المتجمدة على الأعواد، مكتوب عليها Epsicle قبل ما الاسم يتغير."], "fact_rules_en": "In 1905, 11-year-old Frank Epperson left a cup of powdered soda mix and water with a wooden stirring stick on his San Francisco porch on a cold night, and it froze with the stick in it. He made the frozen treat for his neighborhood as an adult, patented it in 1924 as the Epsicle, and his children renamed it Popsicle. He later sold the rights to the Joe Lowe Company. No invented dialogue.", "fact_rules_tr": "سنة 1905، فرانك إيبرسون اللي كان عنده 11 سنة نسي كوباية فيها بودرة مشروب ومية وعود تقليب خشبي على شرفة بيته في سان فرانسيسكو في ليلة ساقعة، فاتجمدت والعود جواها. بعد ما كبر عمل الحلوى المتجمدة لجيرانه، وسجّل براءة اختراعها سنة 1924 باسم Epsicle، وأولاده هما اللي غيّروا الاسم لـ Popsicle. بعدين باع الحقوق لشركة جو لو. من غير حوار مختلق.", "scenes": [{"name": "الخطاف", "en_name": "Hook", "icon": "🥶", "a": "0:00", "z": "0:25", "rule": "قاعدة: ممنوع نقول «مصاصة» أو نعرض آيس كريم في أول 15 ثانية. نبدأ بالكوباية المنسية.", "lines": ["ليلة ساقعة في سان فرانسيسكو، سنة 1905.", "طفل كان بيعمل لنفسه مشروب بودرة بالمية.", "قلّبه بعود خشبي صغير... وانشغل ودخل جوه.", "وساب الكوباية برّه، على شرفة البيت، والعود فيها.", "والليلة دي كانت من أبرد ليالي السنة.", "الصبح رجع فاكر الكوباية...", "لقاها بقت كتلة تلج واحدة، والعود واقف في نصها.", "(وقفة)", "مسك العود وشد... وطلع أشهر تسالي الصيف في التاريخ."], "screen": "\"ليلة **ساقعة** — 1905\" ثم \"الكوباية بقت **تلج** والعود جواها\" ثم \"مسك العود... **وشد**\"", "visual": "لقطة فجرية لشرفة عليها صقيع مرسوم، كوباية صغيرة بتلمع من التلج، زووم بطيء على العود الخشبي واقف نص التلج، وإيد صغيرة بتقرب منه.", "why": "الخطاف بيبيع الانتظار: الكل عارف النتيجة (مصاصة) بس الاسم محجوب، والمشاهد مستني لحظة السحبة."}, {"name": "مين فرانك؟", "en_name": "Who is Frank", "icon": "👦", "a": "0:25", "z": "1:05", "rule": "قاعدة: نعرّف البطل ببساطة: طفل عادي عنده 11 سنة، مش مخترع محترف.", "lines": ["البطل ده مش عالم ولا مهندس.", "ده طفل عادي اسمه فرانك إيبرسون، عنده 11 سنة.", "عايش في سان فرانسيسكو، بيلعب وبيعمل مشروباته بنفسه.", "مفيش خطة، ومفيش معمل، ومفيش حتى نية يخترع حاجة.", "مجرد ليلة برد... وكوباية منسية.", "والصدفة دي قعدت معاه لحد ما كبر."], "screen": "\"فرانك إيبرسون (Frank Epperson)\" ثم \"عنده **11 سنة**\" ثم \"مجرد **كوباية منسية**\"", "visual": "كارت تعريفي مرسوم لطفل بملابس بدايات القرن العشرين، جنبه شرفة بيته، والسنة 1905 على خط زمني بسيط.", "why": "التعريف بيكسر توقع «مخترع كبير»: أعظم الاختراعات ممكن تيجي من طفل، وده بيقرّب الحكاية من جمهور القناة."}, {"name": "الليلة اللي غيرت الصيف", "en_name": "The night that changed summer", "icon": "🌙", "a": "1:05", "z": "2:00", "rule": "قاعدة: لحظة الاكتشاف بالتفصيل الموثق: كوباية بودرة ومية وعود، ليلة برد، تلج، وسحبة بالعود.", "lines": ["فرانك كان بيحب يعمل مشروب البودرة بنفسه.", "المية والبودرة والتقليب بالعود... طقوس يومية.", "بس الليلة دي ساب الكوباية برّه ونساها.", "والبرد نزل... والمية تجمدت على مهلها.", "والعود اتجمد جوا التلج، واقف زي مقبض جاهز.", "الصبح فرانك مسك العود، سحب، والمشروب المتجمد طلع من الكوباية قطعة واحدة.", "على عود. شكل جديد من التسالي ماكانش موجود قبل كده.", "وذاقه... وكان حلو. حلو ومتجمد ومعاه مقبض."], "screen": "\"المشروب طلع **قطعة واحدة**\" ثم \"على **عود**\" ثم \"شكل **جديد** من التسالي\"", "visual": "تسلسل مرسوم أربع لقطات: التقليب، النسيان على الشرفة، التجميد بالليل (قمر وصقيع)، والسحبة في الصبح ببطء، والمصاصة تلمع في ضوء الفجر.", "why": "المشهد ده بيوضح الميكانيزم كله: مش بس تجمد، ده تجمد حوالين مقبض، ودي الفكرة العبقرية البسيطة."}, {"name": "سنين ونسيان", "en_name": "Years and forgetting", "icon": "📆", "a": "2:00", "z": "2:45", "rule": "قاعدة: نعرض الفجوة الزمنية بصدق: الفكرة فضلت حكاية عيلة لحد ما كبر وعملها لجيرانه.", "lines": ["فرانك عرف يعمل تسالي حلوة لنفسه وصحابه.", "بس محدش فكر فيها كمشروع.", "كبر، اشتغل، اتجوز وخلف.", "والحكاية فضلت حكاية عيلة: «أبوكم اخترع حاجة وهو طفل».", "لحد ما فرانك بقى راجل كبير وبدأ يعمل الحلوى دي في المناسبات.", "لقاها بتعجب الكبار قبل الصغيرين.", "ففكر: طيب ليه ما تبقاش منتج حقيقي؟"], "screen": "\"الحكاية فضلت **حكاية عيلة**\" ثم \"كبر وعملها في **المناسبات**\" ثم \"ليه ما تبقاش **منتج**؟\"", "visual": "خط زمني مرسوم بيمشي ببطء من 1905 لسنين العشرينات، صور عيلة مرسومة بتتغير، والمصاصة بتظهر في كل مناسبة كتفصيلة صغيرة ثابتة.", "why": "المشهد بيبني الصبر الواقعي: مش كل اختراع بينزل السوق تاني يوم، ودي نقطة صدق مهمة."}, {"name": "إبسيكل تبقى بوبسيكل", "en_name": "Epsicle becomes Popsicle", "icon": "🏷", "a": "2:45", "z": "3:35", "rule": "قاعدة: نحكي البراءة 1924 والاسمين بدقة: إبسيكل من إيبرسون، وبوبسيكل من ولاده.", "lines": ["في سنة 1924 فرانك سجّل براءة اختراعه رسميًا.", "وسمّاها Epsicle... من اسمه: Epperson وكلمة icicle يعني عمود تلج.", "بس ولاده كان ليهم رأي تاني.", "كانوا بيسموها Pop's sicle... تسالي بابا.", "والاسم ده عجب الناس أكتر: Popsicle.", "فالاسم اللي عرفه العالم مش اسم مخترع ولا شركة...", "ده اسم طلع من بيت صغير، من ولاد المخترع نفسه.", "وبعدين الحقوق اتباعت لشركة كبرت المنتج ووصلته لكل أمريكا."], "screen": "\"براءة **1924**\" ثم \"Epsicle → من **Epperson**\" ثم \"ولاده سموها **Popsicle**\"", "visual": "لافتتين مرسومتين: Epsicle بخط قديم، وبعدين Popsicle بخط ألطف بيلمع، وخلفية أطفال بيضحكوا، والعود الخشبي ثابت في النص.", "why": "قصة الاسم لقطة دافية بتخلي الحكاية عائلية وبسيطة، وبتكسر إيقاع التواريخ."}, {"name": "من الشرفة لكل صيف", "en_name": "From the porch to every summer", "icon": "☀", "a": "3:35", "z": "4:25", "rule": "قاعدة: نحكي الانتشار بعمومية صادقة من غير أرقام مبيعات.", "lines": ["المصاصة دخلت كل بيت.", "نكهات تتضاعف، وأشكال تتجدد.", "وبقت جزء من ذكريات الصيف لأجيال كاملة.", "طابور عند عربية التسالي، والفلوس الصغيرة في الإيد، والصوت اللي الكل يعرفه.", "وكل ده بدأ من كوباية متنسية في ليلة برد.", "من طفل عنده 11 سنة، من غير معمل ولا خطة."], "screen": "\"جزء من ذكريات **الصيف**\" ثم \"من **كوباية منسية**\" ثم \"من طفل عنده **11 سنة**\"", "visual": "مونتاج صيفي مرسوم: أطفال بمصاصات بألوان مختلفة، شمس، ظل شجرة، وعربية تسالي قديمة، وبعدين رجوع سريع للكوباية على الشرفة.", "why": "مشهد الانتشار بيربط المنتج بالذكريات الجماعية، وده اللي بيخلي المشاهد يحس إن الحكاية حكايته."}, {"name": "الخلاصة", "en_name": "Takeaway", "icon": "💡", "a": "4:25", "z": "5:10", "rule": "قاعدة: سطرين: عمر الفكرة، وبراءة الأطفال.", "lines": ["الحكاية كلها في سطرين.", "سطر أولاني: الفكرة العظيمة مش ليها سن... ممكن تيجي وأنت بتقلّب مشروبك.", "وسطر تاني: أحيانًا أهم قرار إنك ما ترميش الكوباية المنسية... ترجع لها الصبح.", "فرانك إيبرسون ماخدش براءة اختراعه غير بعد ما كبر، بس الفكرة كانت بتاعته من وهو طفل.", "وكل مصاصة بتتاكل النهاردة شاهدة على ليلة البرد دي.", "تابع سطرين... كل يوم معلومة وحكاية في سطرين."], "screen": "\"الفكرة العظيمة **مش ليها سن**\" ثم \"ما ترميش **الكوباية المنسية**\" ثم \"تابع **سطرين**\"", "visual": "مصاصة بتسيح ببطء في ضوء غروب دافي، وقطراتها بتتحول لنجوم، وبعدين شعار سطرين والتاج الذهبي.", "why": "القفلة بتدي رسالة مشجعة خصوصًا للمشاهدين الصغيرين، وبتربط بالبراند."}], "facts": [{"t": "سنة 1905، فرانك إيبرسون (11 سنة) نسي كوباية مشروب بودرة بالمية وعود تقليب خشبي على شرفة بيته في سان فرانسيسكو في ليلة باردة، فاتجمدت والعود جواها.", "src": "popsicle.com — التاريخ الرسمي، وSmithsonian Magazine"}, {"t": "إيبرسون سجّل براءة الاختراع سنة 1924 باسم Epsicle، وأولاده هما اللي غيّروا الاسم لـ Popsicle، وبعدين باع الحقوق لشركة جو لو.", "src": "popsicle.com وSmithsonian"}], "banned": ["ما نقولش إن فرانك اخترع الآيس كريم أو أول حاجة متجمدة على عود في التاريخ بشكل جازم؛ الحكاية الموثقة عن منتجه هو.", "ما نقولش أرقام مبيعات غير موثقة.", "ما نقولش إنه كسب منها ثروة كبيرة؛ باع الحقوق بدري."], "characters": [{"ar": "فرانك إيبرسون", "en": "Frank Epperson"}], "duration_ar": "5–6 دقائق", "scenes_tr": "1 الخطاف، 2 مين فرانك؟، 3 الليلة اللي غيرت الصيف، 4 سنين ونسيان، 5 إبسيكل تبقى بوبسيكل، 6 من الشرفة لكل صيف، 7 الخلاصة", "prompt_parts": [{"title": "المواصفات الأساسية", "cat": "tech", "en": "Create a long-form Arabic motion-graphics video, 16:9 landscape, 1920x1080, about 5 minutes, 30fps. Title: \"عصير نسي في التلج\" (the story of Frank Epperson and the accidental invention of the Popsicle).", "tr": "اعمل فيديو موشن جرافيك عربي طويل، بالعرض 16:9 وبدقة 1920×1080، مدته حوالي 5 دقايق، بسرعة 30 إطار في الثانية. العنوان: «عصير نسي في التلج» (حكاية فرانك إيبرسون واختراع المصاصة بالصدفة وهو طفل).", "why": "السطر ده بيحدد شكل الفيديو النهائي: النوع والمقاس والمدة والعنوان."}, {"title": "شرط الخطاف (الهوك)", "cat": "key", "en": "open with a hook that grabs attention instantly. Do NOT name Popsicle or show any ice pop in the first 15 seconds. Dive straight into the mystery: a kid forgets a cup with a wooden stick on a cold porch, and finds it frozen solid in the morning.", "tr": "ابدأ بخطاف يشد فورًا. متقولش «مصاصة» ومتعرضش آيس كريم في أول 15 ثانية. ادخل في اللغز على طول: طفل نسي كوباية فيها عود خشب على شرفة ساقعة، وصحى لقاها متجمدة.", "why": "ده أهم جزء: الفكرة إن المشاهد يتشد بلغز ومايعرفش الموضوع الحقيقي غير في لحظة الكشف."}, {"title": "الستايل", "cat": "style", "en": "deep dark navy background (#101828), bold modern Arabic typography (Cairo font) fully RTL, white text with exactly one keyword per screen in orange (#F97316). Words appear one by one synced with the voiceover. Smooth cinematic spring motion with a light 3D depth feel, floating UI cards with soft shadows, seamless transitions, no hard cuts. Clean, minimal, no clutter.", "tr": "خلفية كحلي غامق (#101828)، خطوط عربي عريضة وحديثة (Cairo) من اليمين للشمال بالكامل، نص أبيض وكلمة واحدة بالظبط في كل شاشة برتقالي (#F97316). الكلمات بتظهر واحدة واحدة متزامنة مع الصوت. حركة سينمائية ناعمة بنفس إحساس الزنبرك، وإحساس خفيف بالعمق 3D، وكروت واجهة عايمة بظلال ناعمة، وانتقالات سلسة من غير قطع حاد. نضيف وبسيط ومن غير زحمة.", "why": "ده هو الهوية البصرية الثابتة للقناة في كل الفيديوهات."}, {"title": "اللغة المرئية — الشرفة المتجمدة", "cat": "vis", "en": "- The frozen cup: a 1905 San Francisco porch drawn at dawn, frost on the railing, a cup with a wooden stick frozen solid, warm morning light hitting the ice.\n- The pull: a kid's hand pulling the frozen drink out of the cup by the stick, drawn step by step, the shape sliding out whole.\n- The stand: a small neighborhood stand drawn years later with kids lined up, the same frozen treat on sticks, labeled \"Epsicle\" before the name changes.", "tr": "- الكوباية المتجمدة: شرفة في سان فرانسيسكو سنة 1905 مرسومة وقت الفجر، صقيع على السور، وكوباية فيها عود خشب متجمدة تمامًا، وضوء الصبح بيضرب التلج.\n- السحبة: إيد طفل     <span class="jk-badge">سطرين | Satreen — سيناريو الفيديو رقم ${D.n}</span>
    <h1>${D.title}</h1><div class="jk-sub">${D.hook}</div>
    <p class="jk-meta">سيناريو كامل بالتعليق الصوتي ونص الشاشة والمرئيات • مدة تقريبية ${D.duration_ar} • بصوت <b>جوكر الملك أحمد</b> صاحب الفكرة والتنفيذ</p>`;
  root.appendChild(cov);
  // شوف بنفسك — signature interactive
  if(window.SATREEN_IX && SATREEN_IX[D.slug]){
    const ix=ce('section','jk-ix');
    const hd=ce('div','ix-head');hd.innerHTML='<span class="ix-dot"></span> شوف بنفسك';
    const bd=ce('div','ix-body');ix.appendChild(hd);ix.appendChild(bd);root.appendChild(ix);
    try{SATREEN_IX[D.slug](bd);}catch(e){ix.style.display='none';}
  }
  // tabs
  const tabs=ce('div','jk-tabs');
  const views={sc:ce('div'),pr:ce('div'),fa:ce('div')};
  views.pr.style.display='none';views.fa.style.display='none';
  [['sc','السيناريو','book'],['pr','البرومبت','screen'],['fa','الحقائق','check']].forEach(([k,l,ic],i)=>{
    const b=ce('button','jk-tab'+(i===0?' on':''));b.innerHTML=IC_SVG(ICON[ic])+' '+l;
    b.onclick=()=>{Object.entries(views).forEach(([kk,v])=>v.style.display=kk===k?'':'none');
      tabs.querySelectorAll('.jk-tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');};
    tabs.appendChild(b);
  });
  root.appendChild(tabs);
  Object.values(views).forEach(v=>root.appendChild(v));
  buildScenes(views.sc); buildPrompt(views.pr); buildFacts(views.fa);
  const end=ce('div','jk-end',`سطرين — معلومة وحكاية في سطرين • إعداد وتنفيذ: جوكر الملك أحمد ${''}`);
  end.innerHTML=`سطرين — معلومة وحكاية في سطرين • إعداد وتنفيذ: جوكر الملك أحمد`;
  root.appendChild(end);
}
function buildScenes(v){
  const how=ce('div','jk-how');
  how.innerHTML=`إزاي تستخدم الصفحة؟ دوس على أيقونة مشهد يظهر، ودوس على أي سطر تلوّنه <span class="jk-k o">برتقالي</span> للمهم أو <span class="jk-k g">أخضر</span> للي راجعته.`;
  v.appendChild(how);
  // icon grid
  const grid=ce('div','jk-icons');
  D.scenes.forEach((s,i)=>{
    const b=ce('button','jk-ic');
    b.innerHTML=`<span class="jk-in">${i+1}</span><span class="jk-ico">${iconFor(s.icon||'')}</span><span class="jk-it">${s.name}</span>`;
    b.onclick=()=>{const card=$('#sc'+i);card.style.display='';card.scrollIntoView({behavior:'smooth',block:'start'});};
    grid.appendChild(b);
  });
  const all=ce('button','jk-ic');all.innerHTML=`<span class="jk-ico">${IC_SVG(ICON.eye)}</span><span class="jk-it">كل المشاهد</span>`;
  all.onclick=()=>{v.querySelectorAll('.jk-scene').forEach(c=>c.style.display='');};
  grid.appendChild(all);
  v.appendChild(grid);
  // tools
  const tools=ce('div','jk-tools');
  const showAll=ce('button','jk-tb on','إظهار الكل');const hideAll=ce('button','jk-tb','إخفاء الكل');
  showAll.onclick=()=>{v.querySelectorAll('.jk-scene').forEach(c=>c.style.display='');showAll.classList.add('on');hideAll.classList.remove('on');};
  hideAll.onclick=()=>{v.querySelectorAll('.jk-scene').forEach(c=>c.style.display='none');hideAll.classList.add('on');showAll.classList.remove('on');};
  const cp=ce('button','jk-tb acc','انسخ السيناريو كله');
  cp.onclick=()=>copyText(scenarioText(),cp);
  tools.appendChild(showAll);tools.appendChild(hideAll);tools.appendChild(cp);
  v.appendChild(tools);
  // scene cards
  D.scenes.forEach((s,i)=>{
    const card=ce('div','jk-scene');card.id='sc'+i;
    const sh=ce('div','jk-sh');
    sh.innerHTML=`<span class="jk-num">${i+1}</span>`;
    const h2=ce('h2',null,s.name);sh.appendChild(h2);
    const chip=ce('span','jk-chip',`${s.a} – ${s.z}`);chip.setAttribute('dir','ltr');sh.appendChild(chip);
    card.appendChild(sh);
    if(s.rule){card.appendChild(ce('div','jk-rule',s.rule));}
    const vo=ce('div','jk-vo');vo.appendChild(ce('div','jk-lab','التعليق الصوتي — دوس على أي سطر تلوّنه'));
    s.lines.forEach(ln=>{
      if(/^\(.+\)$/.test(ln.trim())){vo.appendChild(ce('span','jk-pause',ln));return;}
      const b=ce('button','jk-ln');b.textContent=ln;wrapEn(b);
      b.onclick=()=>{b.className='jk-ln'+(b.classList.contains('hl1')?' hl2':b.classList.contains('hl2')?'':' hl1');};
      vo.appendChild(b);
    });
    card.appendChild(vo);
    const row=ce('div','jk-row');
    const scr=ce('div','jk-scr');scr.appendChild(ce('div','jk-lab','نص الشاشة'));scr.appendChild(markKw(s.screen));
    const vis=ce('div','jk-vis');vis.appendChild(ce('div','jk-lab','المرئيات'));const vp=ce('p');vp.textContent=s.visual;wrapEn(vp);vis.appendChild(vp);
    wrapEn(scr);row.appendChild(scr);row.appendChild(vis);card.appendChild(row);
    if(s.why){const ex=ce('div','jk-exp');ex.appendChild(ce('div','jk-lab','ليه المشهد ده؟'));ex.appendChild(ce('p',null,s.why));card.appendChild(ex);}
    v.appendChild(card);
  });
}
function buildPrompt(v){
  const note=ce('div','jk-note','البرومبت الأصلي بالإنجليزي زي ما بيتحط في الأداة، وتحت كل فقرة ترجمتها وسببها. زرار النسخ بينسخ النص الإنجليزي نضيف من غير أي شرح.');
  v.appendChild(note);
  const tools=ce('div','jk-tools');
  const cp=ce('button','jk-tb acc','انسخ البرومبت كله');
  cp.onclick=()=>copyText(D.prompt_en,cp);
  tools.appendChild(cp);v.appendChild(tools);
  const catNames={tech:'تقني',key:'أساسي',style:'ستايل',vis:'مرئيات',txt:'نصوص',rule:'قواعد'};
  D.prompt_parts.forEach(p=>{
    const card=ce('div','jk-pcard');
    const ph=ce('div','jk-ph');ph.appendChild(ce('h3',null,p.title));
    ph.appendChild(ce('span','jk-cat jk-cat-'+p.cat,catNames[p.cat]||p.cat));
    card.appendChild(ph);
    card.appendChild(ce('div','jk-en',p.en));
    card.appendChild(ce('div','jk-tr',p.tr));
    if(p.why){card.appendChild(ce('div','jk-why','ليه؟ '+p.why));}
    v.appendChild(card);
  });
}
function buildFacts(v){
  const sec=ce('div','jk-sec');sec.appendChild(ce('span',null,'الحقائق الموثقة وراء الحكاية'));v.appendChild(sec);
  D.facts.forEach((f,i)=>{
    const r=ce('div','jk-fr');r.appendChild(ce('span','jk-fn',String(i+1)));
    const d=ce('div');d.appendChild(ce('span',null,f.t));
    if(f.src){const s=ce('span','src','المصدر: '+f.src);d.appendChild(s);}
    r.appendChild(d);v.appendChild(r);
  });
  if(D.banned&&D.banned.length){
    const ban=ce('div','jk-ban');ban.appendChild(ce('h3',null,'⛔ ممنوعات التدقيق — حاجات ما تتقالش في الفيديو'));
    const ul=ce('ul');D.banned.forEach(b=>ul.appendChild(ce('li',null,b)));ban.appendChild(ul);v.appendChild(ban);
  }
}
function scenarioText(){
  let out=`سطرين | Satreen — سيناريو الفيديو رقم ${D.n}\n${D.title}\n${D.hook}\n\n`;
  D.scenes.forEach((s,i)=>{
    out+=`المشهد ${i+1}: ${s.name} (${s.a} – ${s.z})\n`;
    if(s.rule)out+=s.rule+'\n';
    out+='التعليق الصوتي:\n'+s.lines.join('\n')+'\n';
    out+='نص الشاشة: '+s.screen.replace(/\*\*/g,'')+'\n';
    out+='المرئيات: '+s.visual+'\n';
    if(s.why)out+='ليه؟ '+s.why+'\n';
    out+='\n';
  });
  return out;
}
build();
</script>
</body></html>
